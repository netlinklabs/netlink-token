name: Import docs from netlinklabs/docs
on:
  workflow_dispatch:

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repo
        uses: actions/checkout@v4

      - name: Checkout source docs repo
        uses: actions/checkout@v4
        with:
          repository: netlinklabs/docs
          token: ${{ secrets.DOCS_REPO_TOKEN }}
          path: source-docs

      - name: Copy docs into target
        run: |
          mkdir -p docs
          cp -r source-docs/* docs/
          rm -rf source-docs

      - name: Commit and push
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add docs/
          git commit -m "Import Netlink token documentation from netlinklabs/docs"
          git push
